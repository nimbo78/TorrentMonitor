version: "3.9"

# Переменные берутся из .env в корне проекта (скопируй из .env.example)
# Запуск только TM:        docker compose up -d
# Запуск TM + бот:         docker compose --profile bot up -d

services:
  torrentmonitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: torrentmonitor:latest
    restart: unless-stopped
    ports:
      - "${TM_PORT:-8080}:80"
    volumes:
      - ${TM_DATA_DIR}:/data/htdocs/db
      - ${TM_TORRENTS_DIR}:/data/htdocs/torrents
    environment:
      - TZ=${TZ:-Europe/Moscow}

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: torrentmonitor-bot:latest
    restart: unless-stopped
    profiles:
      - bot
    depends_on:
      - torrentmonitor
    volumes:
      - bot_data:/app/bot/data
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - TM_ADAPTER=http
      - TM_HTTP_URL=http://torrentmonitor:80
      - TM_HTTP_PASSWORD=${TM_HTTP_PASSWORD:-admin}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_IDS=${TELEGRAM_ALLOWED_IDS}
      - TM_PAGE_SIZE=${TM_PAGE_SIZE:-10}
      - TM_POLL_INTERVAL=${TM_POLL_INTERVAL:-300}
      - TMDB_API_KEY=${TMDB_API_KEY:-}

volumes:
  bot_data:
